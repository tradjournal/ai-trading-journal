<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <title>OneFeb AI Journal - V3</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #58a6ff; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; }
        .sidebar { width: 220px; background: var(--card); height: 100vh; padding: 20px; border-right: 1px solid #30363d; position: fixed; }
        .main { margin-left: 260px; padding: 20px; width: calc(100% - 260px); }
        .card { background: var(--card); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #30363d; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #333; background: #0d1117; color: white; }
        .page { display: none; }
        .active { display: block; }
        .nav-item { cursor: pointer; padding: 10px; border-radius: 5px; margin-bottom: 5px; }
        .nav-item:hover { background: #21262d; }
        .trade-item { border-bottom: 1px solid #333; padding: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>OneFeb AI</h3>
        <div class="nav-item" onclick="showPage('p1')">📝 Journal Entry</div>
        <div class="nav-item" onclick="showPage('p2')">📜 History</div>
        <div class="nav-item" onclick="showPage('p3')">📈 Analytics</div>
    </div>

    <div class="main">
        <div id="p1" class="page active">
            <div class="card">
                <h2>📝 New Trade Entry</h2>
                <input type="text" id="symbol" placeholder="Symbol (Gold/Nifty)">
                <input type="number" id="capital" placeholder="Capital Used">
                <input type="number" id="entry" placeholder="Entry Price">
                <div id="exit-list">
                    <div style="display: flex; gap: 5px;">
                        <input type="number" class="ex-p" placeholder="Exit Price">
                        <input type="number" class="ex-q" placeholder="Qty">
                    </div>
                </div>
                <button onclick="addExitField()" style="width: auto;">+ Exit Point</button>
                <input type="text" id="strategy" placeholder="Strategy Name">
                <button onclick="saveTrade()" style="background: #238636; border: none;">Save Trade</button>
            </div>
        </div>

        <div id="p2" class="page">
            <div class="card">
                <h2>📜 Trade History</h2>
                <div id="history-list">Loading...</div>
            </div>
        </div>

        <div id="p3" class="page">
            <div class="card">
                <h2>📈 Equity Curve</h2>
                <canvas id="equityChart"></canvas>
            </div>
            <div class="card" style="background: #1c2128;">
                <h3>🤖 AI Salla:</h3>
                <p id="ai-advice">Loading advice...</p>
            </div>
        </div>
    </div>

    <script>
        const API = ""; // Base URL

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'p2') loadHistory();
            if(id === 'p3') loadAnalytics();
        }

        function addExitField() {
            const div = document.createElement('div');
            div.style.display = "flex"; div.style.gap = "5px";
            div.innerHTML = `<input type="number" class="ex-p" placeholder="Exit Price"><input type="number" class="ex-q" placeholder="Qty">`;
            document.getElementById('exit-list').appendChild(div);
        }

        async function saveTrade() {
            const exits = [];
            const prices = document.querySelectorAll('.ex-p');
            const qtys = document.querySelectorAll('.ex-q');
            prices.forEach((p, i) => exits.push({price: p.value, qty: qtys[i].value}));

            const data = {
                symbol: document.getElementById('symbol').value,
                capital: document.getElementById('capital').value,
                entry: document.getElementById('entry').value,
                exits: exits,
                strategy: document.getElementById('strategy').value
            };

            await fetch(`/add_trade_v2`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            alert("Trade Saved!");
            location.reload();
        }

        async function loadHistory() {
            const res = await fetch(`/history_v2`);
            const trades = await res.json();
            document.getElementById('history-list').innerHTML = trades.map(t => `
                <div class="trade-item">
                    <span><b>${t.symbol}</b><br><small>${t.strategy}</small></span>
                    <span style="color: ${t.total_pl >=0 ? '#3fb950':'#f85149'}">${t.total_pl}</span>
                </div>
            `).join('');
        }

        async function loadAnalytics() {
            const res = await fetch(`/history_v2`);
            const trades = await res.json();
            const aiRes = await fetch(`/ai_mentor_advice`);
            const aiData = await aiRes.json();
            document.getElementById('ai-advice').innerText = aiData.advice;

            let sum = 0;
            const dataPoints = [0];
            trades.reverse().forEach(t => { sum += t.total_pl; dataPoints.push(sum); });

            new Chart(document.getElementById('equityChart'), {
                type: 'line',
                data: {
                    labels: dataPoints.map((_, i) => i),
                    datasets: [{ label: 'Equity', data: dataPoints, borderColor: '#58a6ff', tension: 0.2 }]
                }
            });
        }
    </script>
</body>
</html>
