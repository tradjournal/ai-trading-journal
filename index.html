<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneFeb Investment - AI Terminal</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; text-align: center; }
        .dashboard { max-width: 1200px; margin: auto; }
        #chart-container { height: 500px; margin: 20px 0; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; }
        .ai-box { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
        .btns { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
        button { padding: 15px 35px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; }
        .buy { background: #238636; color: white; }
        .sell { background: #da3633; color: white; }
        .buy:hover { background: #2ea043; }
        .sell:hover { background: #f85149; }
        .status-badge { color: #58a6ff; font-size: 14px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>OneFeb AI Terminal <span class="status-badge">● Live</span></h1>

        <div class="ai-box">
            <h3>🤖 OneFeb AI मेंटॉर सल्ला:</h3>
            <p id="ai-advice">तुमचा पहिला ट्रेड नोंदवा, AI तुमचे विश्लेषण करण्यास तयार आहे...</p>
            <button onclick="getAIAdvice()" style="font-size: 14px; padding: 8px 15px; background: #21262d; color: #58a6ff; border: 1px solid #30363d;">विश्लेषण अपडेट करा</button>
        </div>
        
        <div id="chart-container"></div>

        <div class="btns">
            <button class="buy" onclick="sendOrder('BUY')">BUY XAUUSD</button>
            <button class="sell" onclick="sendOrder('SELL')">SELL XAUUSD</button>
        </div>

        <div class="ai-box">
            <h3>📜 ट्रेड इतिहास</h3>
            <div id="trade-history">ट्रेड्स लोड होत आहेत...</div>
        </div>
    </div>

    <script>
        const API_URL = "https://ai-trading-journal.onrender.com";
        const USERNAME = localStorage.getItem("username") || "demo_user";

        // TradingView Widget
        new TradingView.widget({
            "autosize": true,
            "symbol": "FX:XAUUSD",
            "interval": "5",
            "theme": "dark",
            "style": "1",
            "locale": "in",
            "container_id": "chart-container"
        });

        // AI सल्ला मिळवण्यासाठी
        async function getAIAdvice() {
            document.getElementById("ai-advice").innerText = "AI विश्लेषण करत आहे...";
            const res = await fetch(`${API_URL}/get_ai_mentor/${USERNAME}`);
            const data = await res.json();
            document.getElementById("ai-advice").innerText = data.advice;
        }

        // ऑर्डर पाठवण्यासाठी
        async function sendOrder(action) {
            await fetch(`${API_URL}/sync_trade`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: USERNAME,
                    symbol: "XAUUSD",
                    profit: 0,
                    action: action,
                    volume: 0.01
                })
            });
            alert(action + " ऑर्डर MT5 ब्रिज कडे पाठवली!");
            loadHistory();
        }

        // इतिहास लोड करण्यासाठी
        async function loadHistory() {
            const res = await fetch(`${API_URL}/history/${USERNAME}`);
            const data = await res.json();
            document.getElementById("trade-history").innerHTML = data.map(t => 
                `<p>✅ ${t.action} | ${t.symbol} | Profit: ${t.profit}</p>`
            ).join("") || "अजून कोणताही ट्रेड नाही.";
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
