<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <title>OneFeb AI Journal & Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .filter-btns { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .filter-btns button { width: auto; padding: 8px 15px; background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
        .filter-btns button.active { background: #1a73e8; color: white; }
        canvas { background: white; border-radius: 10px; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>📈 परफॉर्मन्स ग्राफ (Equity Curve)</h2>
            <div class="filter-btns">
                <button onclick="updateChart('trade')" id="btn-trade" class="active">Trade</button>
                <button onclick="updateChart('day')" id="btn-day">Day</button>
                <button onclick="updateChart('month')" id="btn-month">Month</button>
                <button onclick="updateChart('year')" id="btn-year">Year</button>
            </div>
            <canvas id="equityChart"></canvas>
        </div>

        <div class="card">
            <h2>📝 नवीन ट्रेड नोंदवा</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="text" id="symbol" placeholder="Symbol (उदा. Gold)">
                <input type="number" id="entry" placeholder="Entry Price">
                <input type="number" id="exit" placeholder="Exit Price">
                <input type="number" id="sl" placeholder="Stop Loss">
                <input type="number" id="tp" placeholder="Take Profit">
            </div>
            <textarea id="reason" placeholder="ट्रेड घेण्याचे कारण..."></textarea>
            <button onclick="saveTrade()">ट्रेड सेव्ह करा</button>
        </div>

        <div class="card" style="background: #e7f3ff; border-left: 5px solid #1a73e8;">
            <h3>🤖 OneFeb AI सल्ला:</h3>
            <p id="ai-advice">विश्लेषण लोड होत आहे...</p>
        </div>
    </div>

    <script>
        const API = "https://ai-trading-journal.onrender.com";
        let allTrades = [];
        let myChart;

        async function saveTrade() {
            const data = {
                symbol: document.getElementById('symbol').value,
                entry_price: parseFloat(document.getElementById('entry').value),
                exit_price: parseFloat(document.getElementById('exit').value),
                stop_loss: parseFloat(document.getElementById('sl').value),
                take_profit: parseFloat(document.getElementById('tp').value),
                reason: document.getElementById('reason').value
            };
            await fetch(`${API}/add_trade`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert("ट्रेड जतन झाला!");
            location.reload();
        }

        async function loadData() {
            const res = await fetch(`${API}/history`);
            allTrades = await res.json();
            updateChart('trade');
            
            const aiRes = await fetch(`${API}/get_ai_advice`);
            const aiData = await aiRes.json();
            document.getElementById('ai-advice').innerText = aiData.advice;
        }

        function updateChart(type) {
            document.querySelectorAll('.filter-btns button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');

            let labels = [];
            let dataPoints = [0]; // 0 पासून सुरुवात
            let currentSum = 0;

            if (type === 'trade') {
                allTrades.forEach((t, i) => {
                    currentSum += t.profit_loss;
                    dataPoints.push(currentSum);
                    labels.push("Trade " + (i + 1));
                });
            } else {
                // Day, Month, Year नुसार ग्रुपिंग लॉजिक
                let grouped = {};
                allTrades.forEach(t => {
                    let key = t.date; // Default Day
                    if(type === 'month') key = t.date.substring(0, 7);
                    if(type === 'year') key = t.date.substring(0, 4);
                    grouped[key] = (grouped[key] || 0) + t.profit_loss;
                });
                Object.keys(grouped).sort().forEach(key => {
                    currentSum += grouped[key];
                    dataPoints.push(currentSum);
                    labels.push(key);
                });
            }

            if(myChart) myChart.destroy();
            const ctx = document.getElementById('equityChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ["Start", ...labels],
                    datasets: [{
                        label: 'Cumulative P/L',
                        data: dataPoints,
                        borderColor: '#1a73e8',
                        backgroundColor: 'rgba(26, 115, 232, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                }
            });
        }
        window.onload = loadData;
    </script>
</body>
</html>
